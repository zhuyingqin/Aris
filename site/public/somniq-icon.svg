<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SomniQ app icon" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="92" y1="58" x2="426" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#0a1226"/>
    </linearGradient>
    <linearGradient id="moon" x1="100" y1="120" x2="290" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="0.55" stop-color="#cfdcef"/>
      <stop offset="1" stop-color="#7aa1d6"/>
    </linearGradient>
    <linearGradient id="nodeCyan" x1="320" y1="200" x2="380" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7df3ff"/>
      <stop offset="1" stop-color="#36c8e8"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="280" y1="240" x2="400" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ea7ff"/>
      <stop offset="1" stop-color="#2b6bd9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

    <g filter="url(#softShadow)">
      <path d="M285 130a160 160 0 1 0 0 252 130 130 0 0 1 0-252z" fill="url(#moon)"/>
    </g>

    <g stroke="#7df3ff" stroke-width="2.6" opacity="0.9" stroke-linecap="round">
      <line x1="330" y1="200" x2="372" y2="186"/>
      <line x1="372" y1="186" x2="408" y2="232"/>
      <line x1="408" y1="232" x2="372" y2="288"/>
      <line x1="372" y1="288" x2="312" y2="298"/>
      <line x1="312" y1="298" x2="330" y2="200"/>
      <line x1="372" y1="186" x2="312" y2="298"/>
    </g>

    <g filter="url(#nodeGlow)">
      <circle cx="330" cy="200" r="9" fill="url(#nodeCyan)"/>
      <circle cx="372" cy="186" r="10" fill="url(#nodeCyan)"/>
      <circle cx="408" cy="232" r="9" fill="url(#nodeBlue)"/>
      <circle cx="372" cy="288" r="9" fill="url(#nodeBlue)"/>
      <circle cx="312" cy="298" r="8" fill="url(#nodeBlue)"/>
    </g>

    <g fill="#9fe8ff">
      <path d="M120 130l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" opacity="0.85"/>
      <path d="M408 360l2 5 5 1-4 4 1 5-4-2-4 2 1-5-4-4 5-1z" opacity="0.85"/>
      <path d="M150 380l2 4 4 1-3 3 1 4-4-2-3 2 1-4-3-3 4-1z" opacity="0.7"/>
    </g>
  </g>
</svg>