<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1116" />
    <title>SomniQ Remote</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "SF Pro Text", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #0e1116; color: #d7dee7; }
      body { min-width: 320px; min-height: 100dvh; margin: 0; display: grid; place-items: center; background: #0e1116; }
      p { margin: 0; color: #8a97a6; font-size: 14px; }
    </style>
  </head>
  <body>
    <p>正在打开最新的 SomniQ 工作区…</p>
    <script>
      (async () => {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(
            keys
              .filter((key) => key.startsWith("somniq-remote-shell-"))
              .map((key) => caches.delete(key)),
          );
        }
        window.location.replace("/?build=mobile-v12");
      })().catch(() => window.location.replace("/?build=mobile-v12"));
    </script>
  </body>
</html>
