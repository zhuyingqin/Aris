<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SomniQ 账号</title>
<style>body{font:16px/1.7 system-ui,sans-serif;background:#101820;color:#e8f0f5;margin:0}main{max-width:780px;margin:5vh auto;padding:24px}h1{font-size:30px}section{padding:24px;background:#192530;border:1px solid #354b58;border-radius:16px;margin:18px 0}button,a{color:inherit}button,.button{padding:10px 18px;border:1px solid #6ae3cc;border-radius:8px;background:#21463f;cursor:pointer;display:inline-block;text-decoration:none}button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;max-height:350px;overflow:auto}input[type=text]{width:95%;padding:10px;background:#101820;color:inherit;border:1px solid #68818e;border-radius:6px}#notice{color:#ffdc96}small{color:#9cb0ba}[hidden]{display:none!important}</style>
<script src="/account/app.js" defer></script></head><body><main><h1>SomniQ 账号</h1><p>统一管理账号与算力服务。</p><p id="notice" role="status"></p>
<section id="anonymous"><h2>欢迎使用 SomniQ</h2><p>通过统一账号登录或注册。</p><a class="button" href="/v2/account/login">登录 / 注册</a></section>
<section id="profile" hidden><h2 id="name"></h2><p id="email"></p><small id="id"></small><p><button id="logout">退出当前会话</button></p></section>
<section id="agreement" hidden><h2>使用前请阅读协议</h2><pre id="terms"></pre><label><input id="accepted" type="checkbox">我已阅读并同意以上协议</label><p><button id="consent">确认并继续</button></p></section>
<section id="compute" hidden><h2>算力服务</h2><p id="compute-status"></p><button id="connect">连接算力账户</button><button id="refresh">刷新用量</button><pre id="quota"></pre><p id="migration-note">已有旧账户的用户需先完成账号绑定；连接失败时请保留原账户，不要重复创建。</p></section>
<section id="model-test" hidden><h2>模型连接验证</h2><button id="models">读取模型列表</button><pre id="model-list"></pre><label>模型<input id="model" type="text"></label><label>提问<input id="prompt" type="text" value="请简短介绍你自己。"></label><p><button id="chat">发送</button></p><pre id="answer"></pre></section>
</main></body></html>
