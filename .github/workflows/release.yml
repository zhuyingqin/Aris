name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-metadata:
    runs-on: ubuntu-22.04
    outputs:
      release_timestamp: ${{ steps.timestamp.outputs.release_timestamp }}
      release_unix_timestamp: ${{ steps.timestamp.outputs.release_unix_timestamp }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version and managed gateway TLS
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          with open("desktop/package.json", encoding="utf-8") as source:
              package_version = json.load(source)["version"]
          with open("desktop/src-tauri/tauri.conf.json", encoding="utf-8") as source:
              tauri_version = json.load(source)["version"]
          tag = os.environ["RELEASE_TAG"]
          if package_version != tauri_version or tag != f"v{package_version}":
              raise SystemExit(f"Release version mismatch: tag={tag}, package={package_version}, tauri={tauri_version}")

          with open("desktop/managed-newapi.json", encoding="utf-8") as source:
              base_url = json.load(source)["baseUrl"].rstrip("/")
          parsed = urllib.parse.urlsplit(base_url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment or parsed.path:
              raise SystemExit(f"Managed New API must be a public HTTPS origin: {base_url}")
          status_url = base_url + "/api/status"
          request = urllib.request.Request(status_url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.geturl() != status_url or response.status != 200:
                  raise SystemExit(f"Managed New API redirected or returned HTTP {response.status}")
              if "application/json" not in response.headers.get("Content-Type", ""):
                  raise SystemExit("Managed New API status did not return JSON")
              status = json.load(response)
          if status.get("success") is not True:
              raise SystemExit("Managed New API status did not report success")
          print(f"Verified {base_url} with trusted TLS and a healthy New API response")
          PY

      - name: Capture release upload timestamp
        id: timestamp
        shell: bash
        run: |
          release_timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          release_unix_timestamp=$(date -u -d "$release_timestamp" +%s)
          echo "release_timestamp=$release_timestamp" >> "$GITHUB_OUTPUT"
          echo "release_unix_timestamp=$release_unix_timestamp" >> "$GITHUB_OUTPUT"

  desktop-windows:
    needs: release-metadata
    runs-on: windows-latest
    env:
      ARIS_RELEASE_TIMESTAMP: ${{ needs.release-metadata.outputs.release_timestamp }}
      ARIS_RELEASE_UNIX_TIMESTAMP: ${{ needs.release-metadata.outputs.release_unix_timestamp }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build signed SomniQ Studio installer
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis --ci

      - name: Generate updater manifest
        working-directory: desktop
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run generate:updater-json -- src-tauri/target/release/bundle/nsis

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris-studio-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/SomniQ Studio_*_x64-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/SomniQ Studio_*_x64-setup.exe.sig
            desktop/src-tauri/target/release/bundle/nsis/latest.json

  desktop-macos:
    needs: release-metadata
    # Unsigned universal .app + .dmg. End users will need to
    # right-click → Open the first time to bypass Gatekeeper
    # (no Apple Developer ID signing/notarization).
    runs-on: macos-latest
    env:
      SOMNIQ_BUILD_TARGET: universal-apple-darwin
      ARIS_RELEASE_TIMESTAMP: ${{ needs.release-metadata.outputs.release_timestamp }}
      ARIS_RELEASE_UNIX_TIMESTAMP: ${{ needs.release-metadata.outputs.release_unix_timestamp }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build unsigned SomniQ Studio for macOS (universal)
        working-directory: desktop
        env:
          # Tauri createUpdaterArtifacts is enabled in tauri.conf.json and
          # refuses to build without the private key. The same key signs the
          # macOS .app.tar.gz updater artifact published below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg --ci

      - name: Zip .app bundle
        working-directory: desktop
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          # Replace spaces with dots to match the .dmg naming and avoid
          # the GitHub upload glitch with whitespace in asset names.
          APP_NAME=$(ls -d *.app | head -1)
          ZIP_NAME=$(echo "$APP_NAME" | tr ' ' '.')
          zip -r "${ZIP_NAME}.zip" "$APP_NAME"

      - name: Generate macOS updater manifest
        working-directory: desktop
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run generate:updater-json -- src-tauri/target/universal-apple-darwin/release/bundle/macos --platform macos --out latest-macos.json

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris-studio-macos-universal
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/latest-macos.json
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs:
      - desktop-windows
      - desktop-macos
    runs-on: ubuntu-22.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Merge updater manifests
        run: |
          jq -s '.[0] * .[1]' latest.json macos/latest-macos.json > latest.merged.json
          mv latest.merged.json latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SomniQ Studio_*_x64-setup.exe
            SomniQ Studio_*_x64-setup.exe.sig
            dmg/SomniQ Studio_*.dmg
            macos/SomniQ.Studio.app.zip
            macos/SomniQ Studio.app.tar.gz
            macos/SomniQ Studio.app.tar.gz.sig
            latest.json
          overwrite_files: true
          generate_release_notes: true
