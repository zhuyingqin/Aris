# Standalone workspace: isolated from the root ARIS workspace so the heavy
# Tauri dependency tree never touches the core crates' build / CI. The desktop
# app still consumes the coordination kernel via a plain path dependency.
[workspace]

[package]
name = "aris-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ARIS Studio — desktop UI for designing and monitoring agent teams & workflows"
publish = false

[lib]
name = "aris_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Coordination kernel + session/skills primitives — reused as libraries,
# no business logic duplicated.
tools = { path = "../../crates/tools" }
runtime = { path = "../../crates/runtime" }
