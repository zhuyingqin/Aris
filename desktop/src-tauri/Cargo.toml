# Standalone workspace: isolated from the root ARIS workspace so the heavy
# Tauri dependency tree never touches the core crates' build / CI. The desktop
# app still consumes the coordination kernel via a plain path dependency.
[workspace]

[package]
name = "aris-desktop"
version = "0.4.26"
edition = "2021"
license = "MIT"
description = "ARIS Studio — desktop UI for designing and monitoring agent teams & workflows"
publish = false

[lib]
name = "aris_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
encoding_rs = "0.8"
zip = { version = "4.6.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "cookies", "gzip", "brotli", "deflate"] }
# Mail integration (Gmail API + Microsoft Graph): OAuth2 PKCE + RFC822 encoding.
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
native-tls = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
# Coordination kernel + session/skills primitives + chat engine building
# blocks — reused as libraries, no business logic duplicated.
tools = { path = "../../crates/tools" }
notebook = { path = "../../crates/notebook" }
runtime = { path = "../../crates/runtime" }
api = { path = "../../crates/api" }
aris-executor = { path = "../../crates/executor" }
aris-chat = { path = "../../crates/chat" }
aris-commands = { package = "commands", path = "../../crates/commands" }
remote-protocol = { path = "../../crates/remote-protocol" }
# Long-lived remote device secrets are held by the operating system credential
# store (Windows Credential Manager, macOS Keychain, or Linux keyutils), never
# in the readable desktop configuration file.
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Integrated terminal: cross-platform PTY (ConPTY on Windows) for the Code page.
portable-pty = "0.8"
