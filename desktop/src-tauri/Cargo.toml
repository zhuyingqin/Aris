# Standalone workspace: isolated from the root ARIS workspace so the heavy
# Tauri dependency tree never touches the core crates' build / CI. The desktop
# app still consumes the coordination kernel via a plain path dependency.
[workspace]

[package]
name = "aris-desktop"
version = "0.4.61"
edition = "2021"
license = "MIT"
description = "ARIS Studio — desktop research workspace for chat, lab, literature, mail, typeset, and scheduled tasks"
publish = false
default-run = "aris-desktop"

[lib]
name = "aris_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
semver = "1"
toml = "0.8"
encoding_rs = "0.8"
pdf-extract = "0.12"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Embedded VS Code runtime: VSCodium publishes `reh-web` as a gzipped tarball.
# Both crates were already in the lock file as transitive dependencies.
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "cookies", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Mail integration (Gmail API + Microsoft Graph): OAuth2 PKCE + RFC822 encoding.
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
native-tls = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
# Coordination kernel + session/skills primitives + chat engine building
# blocks — reused as libraries, no business logic duplicated.
tools = { path = "../../crates/tools" }
notebook = { path = "../../crates/notebook" }
runtime = { path = "../../crates/runtime" }
api = { path = "../../crates/api" }
aris-executor = { path = "../../crates/executor" }
aris-chat = { path = "../../crates/chat" }
remote-protocol = { path = "../../crates/remote-protocol" }
compute = { path = "../../crates/compute" }
# Long-lived remote device secrets are held by the operating system credential
# store (Windows Credential Manager, macOS Keychain, or Linux keyutils), never
# in the readable desktop configuration file.
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Integrated terminal: cross-platform PTY (ConPTY on Windows) for the Code page.
walkdir = "2"
# `AppCtx` is a dyn-safe host port with async methods, which stable Rust cannot
# express natively; this erases them to boxed futures.
async-trait = "0.1"
# `aris-devserver` only. Optional so the shipped app never builds an HTTP stack.
axum = { version = "0.8", optional = true }

[features]
# Hosts the AppCtx-ported commands over loopback HTTP for browser-based
# debugging. Never enabled by `cargo tauri build`.
devserver = ["dep:axum"]

[[bin]]
name = "aris-desktop"
path = "src/main.rs"

[[example]]
name = "devserver"
required-features = ["devserver"]

[dev-dependencies]
tempfile = "3.27"
