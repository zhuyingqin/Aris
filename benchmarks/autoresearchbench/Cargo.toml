[package]
name = "somniq-autoresearchbench"
version = "0.1.0"
edition = "2021"
publish = false

# Keep the benchmark harness isolated from the product workspace while still
# reusing SomniQ's runtime crates through explicit path dependencies.
[workspace]

[dependencies]
aris-chat = { path = "../../crates/chat" }
aris-executor = { path = "../../crates/executor" }
runtime = { path = "../../crates/runtime" }
tools = { path = "../../crates/tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

