<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .band-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #1e293b; }
      .box-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .box-text { font: 500 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .arrow-label { font: 600 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .small { font: 500 12px Arial, Helvetica, sans-serif; fill: #64748b; }
      .band { stroke-width: 1.5; rx: 18; }
      .box { stroke-width: 2; rx: 14; }
      .callout { stroke-width: 2; rx: 14; }
      .arrow { stroke: #334155; stroke-width: 3.2; fill: none; marker-end: url(#arrowhead); }
      .soft-arrow { stroke: #64748b; stroke-width: 2.4; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowheadSoft); }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowheadSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="uiGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="teamGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#f7fef9"/>
    </linearGradient>
    <linearGradient id="execGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fffaf4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="1120" fill="#ffffff"/>
  <text class="title" x="800" y="54" text-anchor="middle">ARIS Three-Layer Architecture</text>
  <text class="subtitle" x="800" y="82" text-anchor="middle">Thin UI callers, explicit Team state transitions, and a shared provider executor boundary</text>

  <rect class="band" x="60" y="115" width="1480" height="190" fill="url(#uiGrad)" stroke="#93c5fd"/>
  <text class="band-title" x="92" y="148">UI / CLI Call Layer</text>

  <rect class="box" x="135" y="178" width="250" height="82" fill="#eff6ff" stroke="#3b82f6" filter="url(#shadow)"/>
  <text class="box-title" x="260" y="207" text-anchor="middle">React Views</text>
  <text class="box-text" x="260" y="231" text-anchor="middle">TeamView, Chat, Settings</text>

  <rect class="box" x="485" y="178" width="250" height="82" fill="#eff6ff" stroke="#3b82f6" filter="url(#shadow)"/>
  <text class="box-title" x="610" y="207" text-anchor="middle">Tauri Commands</text>
  <text class="box-text" x="610" y="231" text-anchor="middle">commands.rs facade</text>

  <rect class="box" x="835" y="178" width="250" height="82" fill="#eff6ff" stroke="#3b82f6" filter="url(#shadow)"/>
  <text class="box-title" x="960" y="207" text-anchor="middle">Desktop Chat</text>
  <text class="box-text" x="960" y="231" text-anchor="middle">engine.rs chat_send</text>

  <rect class="box" x="1185" y="178" width="250" height="82" fill="#eff6ff" stroke="#3b82f6" filter="url(#shadow)"/>
  <text class="box-title" x="1310" y="207" text-anchor="middle">aris CLI / REPL</text>
  <text class="box-text" x="1310" y="231" text-anchor="middle">main.rs slash commands</text>

  <path class="arrow" d="M385 219 L485 219"/>
  <path class="arrow" d="M735 219 L835 219"/>
  <text class="arrow-label" x="785" y="207" text-anchor="middle">chat</text>

  <rect class="band" x="60" y="345" width="1480" height="330" fill="url(#teamGrad)" stroke="#86efac"/>
  <text class="band-title" x="92" y="378">Team State-Machine Layer</text>

  <rect class="box" x="675" y="392" width="250" height="78" fill="#ecfdf5" stroke="#16a34a" filter="url(#shadow)"/>
  <text class="box-title" x="800" y="421" text-anchor="middle">Tool Facade</text>
  <text class="box-text" x="800" y="445" text-anchor="middle">tools::execute_tool</text>

  <rect class="box" x="215" y="535" width="290" height="92" fill="#f0fdf4" stroke="#22c55e" filter="url(#shadow)"/>
  <text class="box-title" x="360" y="565" text-anchor="middle">Workflow State Machine</text>
  <text class="box-text" x="360" y="590" text-anchor="middle">Plan / Start / Pause</text>
  <text class="box-text" x="360" y="612" text-anchor="middle">Resume / Stop</text>

  <rect class="box" x="655" y="535" width="290" height="92" fill="#f0fdf4" stroke="#22c55e" filter="url(#shadow)"/>
  <text class="box-title" x="800" y="565" text-anchor="middle">Team State Machine</text>
  <text class="box-text" x="800" y="590" text-anchor="middle">Spawn / Claim / Complete</text>
  <text class="box-text" x="800" y="612" text-anchor="middle">Wait / Verify</text>

  <rect class="box" x="1095" y="535" width="290" height="92" fill="#f0fdf4" stroke="#22c55e" filter="url(#shadow)"/>
  <text class="box-title" x="1240" y="565" text-anchor="middle">Verification Gate</text>
  <text class="box-text" x="1240" y="590" text-anchor="middle">VerifyDeliverable</text>
  <text class="box-text" x="1240" y="612" text-anchor="middle">LlmReview</text>

  <rect class="box" x="1065" y="392" width="340" height="78" fill="#f8fafc" stroke="#64748b" filter="url(#shadow)"/>
  <text class="box-title" x="1235" y="421" text-anchor="middle">Run-State Files</text>
  <text class="box-text" x="1235" y="445" text-anchor="middle">teams / tasks / mailbox / events / manifests</text>

  <path class="arrow" d="M610 260 C610 318 735 326 762 392"/>
  <path class="arrow" d="M1310 260 C1310 320 890 323 833 392"/>
  <text class="arrow-label" x="1185" y="330">tool calls</text>
  <path class="arrow" d="M960 260 C960 316 850 326 820 392"/>

  <path class="arrow" d="M720 470 C650 505 492 505 405 535"/>
  <path class="arrow" d="M800 470 L800 535"/>
  <path class="arrow" d="M880 470 C950 505 1110 505 1195 535"/>
  <path class="arrow" d="M945 581 L1065 448"/>
  <path class="arrow" d="M505 581 C690 650 1030 650 1145 470"/>
  <path class="arrow" d="M1095 581 L945 581"/>

  <rect class="band" x="60" y="715" width="1480" height="280" fill="url(#execGrad)" stroke="#fdba74"/>
  <text class="band-title" x="92" y="748">Unified Executor Layer</text>

  <rect class="box" x="145" y="795" width="280" height="86" fill="#fff7ed" stroke="#f97316" filter="url(#shadow)"/>
  <text class="box-title" x="285" y="826" text-anchor="middle">ConversationRuntime</text>
  <text class="box-text" x="285" y="851" text-anchor="middle">session loop, permissions</text>
  <text class="box-text" x="285" y="871" text-anchor="middle">compaction</text>

  <rect class="box" x="555" y="795" width="300" height="86" fill="#fff7ed" stroke="#f97316" filter="url(#shadow)"/>
  <text class="box-title" x="705" y="826" text-anchor="middle">Shared Executor Boundary</text>
  <text class="box-text" x="705" y="851" text-anchor="middle">provider config, retries</text>
  <text class="box-text" x="705" y="871" text-anchor="middle">streaming, cancel, usage</text>

  <rect class="callout" x="955" y="772" width="360" height="86" fill="#fff1f2" stroke="#e11d48" filter="url(#shadow)"/>
  <text class="box-title" x="1135" y="802" text-anchor="middle">Collapse Current Duplication</text>
  <text class="box-text" x="1135" y="827" text-anchor="middle">CLI openai_executor.rs</text>
  <text class="box-text" x="1135" y="847" text-anchor="middle">+ desktop engine.rs</text>

  <rect class="box" x="450" y="910" width="250" height="64" fill="#fffaf4" stroke="#fb923c"/>
  <text class="box-title" x="575" y="936" text-anchor="middle">Anthropic Executor</text>
  <text class="box-text" x="575" y="958" text-anchor="middle">Messages API / SSE</text>

  <rect class="box" x="760" y="910" width="280" height="64" fill="#fffaf4" stroke="#fb923c"/>
  <text class="box-title" x="900" y="936" text-anchor="middle">OpenAI-Compatible Executor</text>
  <text class="box-text" x="900" y="958" text-anchor="middle">chat completions / SSE</text>

  <rect class="box" x="1130" y="910" width="210" height="64" fill="#f8fafc" stroke="#64748b"/>
  <text class="box-title" x="1235" y="936" text-anchor="middle">api crate</text>
  <text class="box-text" x="1235" y="958" text-anchor="middle">HTTP, auth, SSE</text>

  <path class="arrow" d="M285 881 C330 918 475 918 555 848"/>
  <path class="arrow" d="M425 838 L555 838"/>
  <path class="soft-arrow" d="M1135 858 C1080 900 880 890 782 881"/>
  <text class="small" x="1018" y="892">consolidate into shared boundary</text>
  <path class="arrow" d="M675 881 L602 910"/>
  <path class="arrow" d="M735 881 L865 910"/>
  <path class="arrow" d="M700 942 L1130 942"/>
  <path class="arrow" d="M1040 942 L1130 942"/>
  <path class="arrow" d="M1240 974 L1240 1030"/>

  <path class="arrow" d="M800 627 C800 710 570 730 425 817"/>
  <path class="arrow" d="M1240 627 C1240 700 860 724 745 795"/>
  <path class="arrow" d="M1240 470 L1240 535"/>

  <rect class="band" x="60" y="1030" width="1480" height="62" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect class="box" x="1030" y="1045" width="410" height="34" fill="#ffffff" stroke="#94a3b8"/>
  <text class="box-text" x="1235" y="1067" text-anchor="middle">LLM Providers: Anthropic / OpenAI / Gemini / Kimi / MiniMax / custom proxies</text>
  <rect class="box" x="155" y="1045" width="390" height="34" fill="#ffffff" stroke="#94a3b8"/>
  <text class="box-text" x="350" y="1067" text-anchor="middle">Workspace + ARIS state dir</text>
  <path class="arrow" d="M1235 974 L1235 1045"/>
  <path class="arrow" d="M1235 470 C1450 660 650 990 410 1045"/>
</svg>
