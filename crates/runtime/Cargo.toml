[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
sha2 = "0.10"
flate2 = "1.1.9"
getrandom = "0.3"
glob = "0.3"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
walkdir = "2"

[build-dependencies]
walkdir = "2"

# Mirrors crates/notebook: the workspace forbids unsafe, but `managed_job`
# needs audited Win32 Job Object FFI, so this crate denies instead and the one
# module opts in explicitly.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
