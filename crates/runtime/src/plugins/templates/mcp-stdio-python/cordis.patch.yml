# Starts server.py as a stdio MCP server. Arguments starting with ./ resolve
# inside the installed snapshot, not the draft directory; the server's working
# directory is its own data directory, never the project. What it may use
# (network, project files, variables from this computer) is declared in
# package.json under somniq.capabilities.
- insert:
    - id: mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: example
        command: __PYTHON__
        args:
          - ./server.py
        toolCallTimeoutMs: 60000
